<!DOCTYPE html>
<html>
<head>                                                            
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SPEED CHECKER V1.2</title>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    color:red;
}

button{
    background:red;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    font-size:18px;
    margin:15px;
}

.card{
    background:#111;
    border:1px solid red;
    border-radius:15px;
    margin:15px auto;
    padding:15px;
    max-width:350px;
}

.value{
    font-size:48px;
    color:#00ff00;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>SPEED CHECKER V1.2</h1>

<button>CONNECT BLE</button>

<div class="card">
    <h2>RPM</h2>
    <div class="value">0</div>
</div>

<div class="card">
    <h2>KM/H</h2>
    <div class="value">0.0</div>
</div>

<div class="card">
    <h2>MAX RPM</h2>
    <div class="value">0</div>
</div>

<div class="card">
    <h2>MAX KM/H</h2>
    <div class="value">0.0</div>
</div>
<script>

const button = document.querySelector("button");
const values = document.querySelectorAll(".value");

button.addEventListener("click", async () => {

  try {

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [
          { name: "SPEED_CHECKER" }
        ],
        optionalServices: ["12345678-1234-1234-1234-1234567890ab"]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService("12345678-1234-1234-1234-1234567890ab");

    const characteristic =
      await service.getCharacteristic("abcd1234-5678-1234-5678-1234567890ab");

    characteristic.startNotifications();

    characteristic.addEventListener(
      "characteristicvaluechanged",
      (event) => {

        const value =
          new TextDecoder().decode(
            event.target.value
          );

        console.log(value);

        const rpm =
          /RPM=(\d+)/.exec(value);

        const kmh =
          /KMH=([\d.]+)/.exec(value);

        const maxrpm =
          /MAXRPM=(\d+)/.exec(value);

        const maxkmh =
          /MAXKMH=([\d.]+)/.exec(value);

        if(rpm)
          values[0].innerText = rpm[1];

        if(kmh)
          values[1].innerText = kmh[1];

        if(maxrpm)
          values[2].innerText = maxrpm[1];

        if(maxkmh)
          values[3].innerText = maxkmh[1];
      }
    );

    button.innerText = "CONNECTED";

  } catch(err) {

    alert(err);

  }

});

</script>
</body>
</html>
